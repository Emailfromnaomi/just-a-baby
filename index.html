<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#22476E">
<meta name="description" content="A baby tracker that reads like a life-sim game: needs bars, moodlets and one-tap logging.">
<title>Just a Baby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#E6EEF2; --ink:#1D2B3A; --muted:#5A6A7A; --card:#FFFFFF; --line:#D3DEE6;
  --panel:#22476E; --panel2:#2C5A87; --panel-ink:#EEF6FF; --panel-muted:#A9C4DE; --edge:#86C8EA;
  --gold:#F4B942; --gold-ink:#3A2A05;
  --studio1:#F7E0C8; --studio2:#E9BE97; --studio3:#D9A67C;
  --bad:#D9725F; --good:#3E9E5B;
  --shadow:0 1px 0 rgba(255,255,255,.25) inset, 0 6px 18px rgba(20,40,70,.18);
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1821; --ink:#E3ECF4; --muted:#93A5B6; --card:#17232F; --line:#26384A;
    --panel:#14304F; --panel2:#1D4068; --panel-ink:#E8F2FC; --panel-muted:#8FB0CF; --edge:#4E9CC6;
    --gold:#E9AE3A; --gold-ink:#2A1C02;
    --studio1:#5B4A5E; --studio2:#3E3448; --studio3:#2C2536;
    --bad:#E0826F; --good:#5CC27A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1821; --ink:#E3ECF4; --muted:#93A5B6; --card:#17232F; --line:#26384A;
  --panel:#14304F; --panel2:#1D4068; --panel-ink:#E8F2FC; --panel-muted:#8FB0CF; --edge:#4E9CC6;
  --gold:#E9AE3A; --gold-ink:#2A1C02;
  --studio1:#5B4A5E; --studio2:#3E3448; --studio3:#2C2536;
  --bad:#E0826F; --good:#5CC27A;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding:0 16px calc(100px + env(safe-area-inset-bottom,0px));}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding-block:12px 10px}
.who{display:flex;flex-direction:column;min-width:0;flex:1}
.who h1{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .age{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daychip{font-family:var(--display);font-weight:700;background:var(--panel);color:var(--panel-ink);border-radius:12px;padding:5px 11px 3px;text-align:right;line-height:1.05;box-shadow:var(--shadow);flex:none}
.daychip small{display:block;font-family:var(--body);font-weight:400;font-size:11px;color:var(--panel-muted);letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.daychip b{font-size:19px;font-variant-numeric:tabular-nums}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}

.layout{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:860px){.layout{grid-template-columns:1.05fr 1fr;align-items:start}}

/* portrait */
.card{border-radius:22px;overflow:hidden;box-shadow:var(--shadow);background:var(--card)}
.portrait{position:relative;height:clamp(250px,42vh,440px);
  background:
    radial-gradient(circle at 18% 22%,rgba(255,255,255,.35) 0 22px,transparent 23px),
    radial-gradient(circle at 84% 30%,rgba(255,255,255,.22) 0 34px,transparent 35px),
    radial-gradient(circle at 74% 78%,rgba(255,255,255,.14) 0 18px,transparent 19px),
    radial-gradient(ellipse at 50% 40%,var(--studio1),var(--studio2) 60%,var(--studio3));}
.portrait.night::after{content:"";position:absolute;inset:0;background:rgba(18,22,58,.22);pointer-events:none}
.baby{position:absolute;inset:0;border:0;background:none;padding:0;display:block;width:100%;height:100%}
.baby svg{display:block;width:100%;height:100%}
.av .breathe{animation:breathe 4.2s ease-in-out infinite;transform-origin:150px 320px}
.av .headg{animation:sway 8s ease-in-out infinite;transform-origin:150px 250px}
.av.sleep .breathe{animation-duration:6s}
.av .lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 5.8s infinite}
.av .lid.r{animation-delay:.02s}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.018)}}
@keyframes sway{0%,100%{transform:rotate(0)}30%{transform:rotate(1.4deg)}70%{transform:rotate(-1.2deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(0)}95.5%{transform:scaleY(1)}}
.speech{position:absolute;left:calc(50% + 70px);top:22px;background:#fff;color:#1D2B3A;font-family:var(--display);font-weight:700;font-size:17px;padding:6px 12px 4px;border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.15);white-space:nowrap;transition:opacity .25s,transform .25s;pointer-events:none}
.speech::after{content:"";position:absolute;left:10px;bottom:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
.speech.off{opacity:0;transform:translateY(6px)}
@media (max-width:420px){.speech{left:auto;right:12px}}
.samplepill{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.9);color:#1D2B3A;border-radius:999px;padding:4px 10px 3px;font-size:12.5px;font-weight:700;max-width:calc(100% - 24px)}
.status{display:flex;align-items:center;gap:8px;padding:10px 12px;overflow-x:auto;scrollbar-width:none}
.status::-webkit-scrollbar{display:none}
.moodtag{display:flex;align-items:center;gap:7px;font-family:var(--display);font-weight:800;font-size:17px;padding-right:6px;flex:none}
.moodtag i{width:12px;height:12px;border-radius:50%;background:var(--mood,#6BC46B);box-shadow:0 0 0 3px color-mix(in srgb,var(--mood,#6BC46B) 30%,transparent)}
.moodlet{display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:10px;padding:4px 9px 4px 4px;font-size:13px;font-weight:700;white-space:nowrap;flex:none}
.moodlet .mi{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:13px}
.moodlet.good .mi{background:var(--good)}
.moodlet.bad .mi{background:var(--bad)}

/* needs */
.hud{background:linear-gradient(180deg,var(--panel2),var(--panel));color:var(--panel-ink);border-radius:22px;padding:16px;box-shadow:var(--shadow);border:2px solid color-mix(in srgb,var(--edge) 45%,transparent)}
.needs{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.need .row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.need .ic{width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none}
.need .ic svg{width:18px;height:18px}
.need .nm{font-family:var(--display);font-weight:700;font-size:16px;line-height:1}
.bar{height:18px;border-radius:999px;background:rgba(0,0,0,.28);box-shadow:0 1px 0 rgba(255,255,255,.12),0 1px 3px rgba(0,0,0,.35) inset;overflow:hidden;padding:2px}
.bar i{display:block;height:100%;border-radius:999px;background:var(--c);min-width:12px;background-image:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0) 55%,rgba(0,0,0,.08));transition:width .6s ease,background-color .6s}
.bar.empty i{background:rgba(255,255,255,.18);width:100%!important}
.need .sub{font-size:12.5px;color:var(--panel-muted);margin-top:4px;min-height:2.6em}

/* action bar */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,var(--panel2),var(--panel));border-top:2px solid color-mix(in srgb,var(--edge) 50%,transparent);box-shadow:0 -6px 20px rgba(10,30,60,.18)}
.actions{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.act{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;border-radius:14px;padding:8px 2px 6px;background:rgba(255,255,255,.1);color:var(--panel-ink);min-height:64px;box-shadow:0 1px 0 rgba(255,255,255,.18) inset}
.act svg{width:26px;height:26px}
.act span{font-family:var(--display);font-weight:700;font-size:14px;line-height:1}
.act:active{transform:translateY(1px);background:rgba(255,255,255,.18)}
.act.on{background:var(--gold);color:var(--gold-ink)}

/* sheet */
.sheetwrap{position:fixed;inset:0;z-index:40;background:rgba(10,20,35,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;animation:up .22s ease-out}
@media (min-width:600px){.sheetwrap{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 4px;font-family:var(--display);font-weight:800;font-size:22px;display:flex;align-items:center;gap:10px}
.sheet h3 svg{width:26px;height:26px}
.sheet .hint{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.lbl{display:block;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 13px;font-weight:700;min-height:46px}
.chip[aria-pressed="true"]{border-color:var(--panel2);background:var(--panel2);color:var(--panel-ink)}
.chip.big{flex:1 1 30%;min-height:64px;font-family:var(--display);font-size:17px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:22px;font-weight:700}
.stepper output{font-family:var(--display);font-weight:800;font-size:24px;min-width:96px;text-align:center;font-variant-numeric:tabular-nums}
.primary{width:100%;margin-top:18px;border:0;border-radius:14px;background:var(--gold);color:var(--gold-ink);font-family:var(--display);font-weight:800;font-size:19px;min-height:56px}
.ghost{width:100%;margin-top:8px;border:0;background:none;color:var(--muted);min-height:44px}
input[type=text],input[type=date],input[type=number],input[type=datetime-local]{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-height:48px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field small{display:block;color:var(--muted);font-size:12.5px;margin-bottom:4px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--panel2)}
.pv{border-radius:18px;overflow:hidden;height:230px;margin-bottom:4px;background:radial-gradient(ellipse at 50% 40%,var(--studio1),var(--studio2) 60%,var(--studio3))}
.pv svg{width:100%;height:100%;display:block}
.toggle{display:flex;align-items:center;gap:10px;min-height:44px}
.toggle input{width:22px;height:22px}
.disclaim{font-size:12.5px;color:var(--muted);margin-top:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--bg);border-radius:12px;padding:8px 10px}
.stat small{display:block;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.stat em{font-style:normal;font-size:12px;color:var(--muted);margin-left:4px}
.events{list-style:none;margin:0;padding:0}
.ev{display:grid;grid-template-columns:auto 30px 1fr auto;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.ev time{white-space:nowrap;min-width:62px;font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--muted)}
.ev .eic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--bg)}
.ev .eic svg{width:18px;height:18px}
.ev .what b{display:block;font-weight:700}
.ev .what span{font-size:13px;color:var(--muted)}
.ev .del{border:1px solid var(--line);background:none;border-radius:9px;padding:6px 10px;font-size:12.5px;color:var(--muted);min-height:36px}
.ev .del.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.daysep{font-family:var(--display);font-weight:700;font-size:14px;color:var(--muted);padding:12px 0 4px;border-top:1px solid var(--line)}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
.foot{font-size:12.5px;color:var(--muted);margin-top:12px}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:#1D2B3A;color:#fff;border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);font-size:14.5px}
.toast button{border:0;background:var(--gold);color:var(--gold-ink);border-radius:10px;padding:8px 14px;font-weight:700;min-height:40px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="who">
      <h1 id="babyName">Baby</h1>
      <div class="age" id="ageLine">No birthday yet</div>
    </div>
    <div class="daychip"><small id="clockLbl">Morning</small><b id="dayCount">Day 1</b></div>
    <button class="iconbtn" id="historyBtn" aria-label="History">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3 4v4h4"/><path d="M12 7.5V12l3 2"/></svg>
    </button>
    <button class="iconbtn" id="settingsBtn" aria-label="Edit baby and settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>
    </button>
  </header>

  <main class="layout">
    <section class="card" aria-label="Your baby">
      <div class="portrait" id="portrait">
        <button class="baby" id="baby" aria-label="Tap the baby"></button>
        <div class="speech off" id="speech">Goo!</div>
        <div class="samplepill" id="samplePill" hidden>Sample day · log something to start</div>
      </div>
      <div class="status">
        <div class="moodtag"><i></i><span id="moodLabel">Content</span></div>
        <div id="moodlets" style="display:flex;gap:6px"></div>
      </div>
    </section>

    <section class="hud" aria-label="Needs">
      <div class="needs" id="needs"></div>
    </section>
  </main>
</div>

<nav class="actionbar" aria-label="Log something">
  <div class="actions" id="actions"></div>
</nav>

<div class="sheetwrap" id="sheetWrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const MIN=60000, HR=3600000, DAY=86400000;

/* ---------- icons ---------- */
const IC={
 bottle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h4M10.5 2v3l-2 2.5V20a2 2 0 0 0 2 2h3a2 2 0 0 0 2-2V7.5l-2-2.5V2"/><path d="M8.5 12h7M8.5 16h7"/></svg>',
 moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
 sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>',
 drop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3s6 6.6 6 11a6 6 0 0 1-12 0c0-4.4 6-11 6-11z"/></svg>',
 diaper:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7h18v3c0 5-4 9-9 9s-9-4-9-9z"/><path d="M8 10c0 2.5 1.8 4.5 4 4.5s4-2 4-4.5"/></svg>',
 heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.3-8.6-8.7C2.2 8 4.2 5 7.2 5c1.9 0 3.2 1 4.8 2.8C13.6 6 14.9 5 16.8 5c3 0 5 3 3.8 6.3C19 15.7 12 20 12 20z"/></svg>',
 rattle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="9" r="5.5"/><path d="M13 13l7 7M18 16l-2 2"/><circle cx="9" cy="9" r="1.2" fill="currentColor"/></svg>',
 tub:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18v2a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5z"/><path d="M6 12V6a2 2 0 0 1 3.5-1.3M7 19l-1 2M17 19l1 2"/><circle cx="13" cy="8" r="1"/><circle cx="16" cy="6" r="1.3"/></svg>'
};
const TYPE_ICON={feed:'bottle',sleep:'moon',diaper:'diaper',play:'rattle',bath:'tub'};
const SUBS={
 feed:{bottle:'Bottle',left:'Left side',right:'Right side',solids:'Solids'},
 diaper:{wet:'Wet',dirty:'Dirty',both:'Wet + dirty'},
 play:{tummy:'Tummy time',play:'Playtime',read:'Story time',cuddle:'Cuddles',outside:'Outside'}
};
const TYPE_LABEL={feed:'Feed',sleep:'Sleep',diaper:'Diaper',play:'Play',bath:'Bath'};

/* ---------- look options ---------- */
const SKIN=['#F6D8C4','#EDC1A0','#D9A07A','#BF8158','#955D3E','#6A412B'];
const HAIRC=['#2A1A12','#5E3A22','#A06A3A','#E0BD72','#B8532E','#E9DFC8'];
const EYES=['#4A3224','#4C79A8','#58804C','#7A6A4A'];
const OUTFIT=['#8FC0E3','#F0A7B8','#EDCB63','#95CFA0','#BFA8E0','#8E3848'];
const HAIRS={fuzz:'Peach fuzz',wisps:'Wisps',curls:'Curls',buns:'Space buns',puffs:'Puffs + bows',braids:'Braids'};
const OUTFITS={onesie:'Onesie',stripes:'Striped tee',stars:'Star sleeper',gingham:'Gingham romper',overalls:'Overalls'};

/* ---------- state ---------- */
const DEFAULT_PROFILE={name:'Baby',birth:'',unit:'ml',feedH:3,wakeH:1.5,diaperH:3,playH:3,sound:true,lastAmount:90,
  look:{skin:1,hair:'wisps',hairColor:1,eyes:0,outfit:0,style:'onesie',paci:false}};
let profile=clone(DEFAULT_PROFILE);
let events={};
let db=null, readOnly=false;
function clone(o){return JSON.parse(JSON.stringify(o))}
function mergeProfile(p){const out=clone(DEFAULT_PROFILE);if(p){Object.assign(out,p);out.look=Object.assign(clone(DEFAULT_PROFILE.look),p.look||{});}
  if(!HAIRS[out.look.hair])out.look.hair=out.look.hair==='none'?'fuzz':'wisps';
  if(!OUTFITS[out.look.style])out.look.style='onesie';
  return out}
function loadLocal(){try{const e=localStorage.getItem('ln-events');if(e)events=JSON.parse(e)||{};const p=localStorage.getItem('ln-profile');if(p)profile=mergeProfile(JSON.parse(p));}catch(_){}}
function saveLocal(){if(db)return;try{localStorage.setItem('ln-events',JSON.stringify(events));localStorage.setItem('ln-profile',JSON.stringify(profile));}catch(_){}}

function sampleEvents(){
  const n=Date.now(), o={};
  const add=(id,type,ago,extra)=>{o[id]=Object.assign({id,type,t:n-ago},extra||{})};
  add('s1','feed',7.2*HR,{sub:'left'});add('s2','diaper',6.8*HR,{sub:'wet'});add('s3','sleep',6.4*HR,{end:n-4.9*HR});

/* ---------- render ---------- */
function ageInfo(){
  if(!profile.birth)return null;
  const b=new Date(profile.birth+'T00:00:00'); if(isNaN(b))return null;
  const t=new Date(); t.setHours(0,0,0,0);
  const days=Math.floor((t-b)/DAY); if(days<0)return null;
  let txt; if(days<14)txt=days+(days===1?' day old':' days old'); else if(days<91)txt=Math.floor(days/7)+' weeks old'; else {let m=(t.getFullYear()-b.getFullYear())*12+t.getMonth()-b.getMonth(); if(t.getDate()<b.getDate())m--; txt=m+' months old';}
  return {day:days+1,txt,days};
}
function partOfDay(h){return h<5?'Night':h<12?'Morning':h<17?'Afternoon':h<21?'Evening':'Night'}
let lastFaceKey='';
function render(){

    <div class="sub">${esc(n.sub)}</div></div>`}).join('');
  renderActions();
  if(sheet&&sheet.kind==='history'&&!document.querySelector('.del.arm'))drawSheet();

function renderActions(){

  const acts=[['feed','Feed','bottle'],['sleep',s?'Wake up':'Nap',s?'sun':'moon'],['diaper','Diaper','diaper'],['play','Play','rattle'],['bath','Bath','tub']];

function historyHTML(){
  const n=Date.now(), mid=new Date(); mid.setHours(0,0,0,0); const m0=mid.getTime();
  const list=all(), today=list.filter(e=>e.t>=m0);

   <div class="stats"><div class="stat"><small>Feeds</small><b>${feeds.length}</b>${bottle?`<em>${fmtAmt(bottle)}</em>`:''}</div>
   <div class="stat"><small>Sleep</small><b>${sleepMs<MIN?'0m':dur(sleepMs)}</b></div>
   <div class="stat"><small>Diapers</small><b>${diapers.length}</b>${diapers.length?`<em>${dirty} dirty</em>`:''}</div>
   <div class="stat"><small>Play</small><b>${today.filter(e=>e.type==='play').length}</b><em>sessions</em></div></div><ul class="events">`;
  const recent=list.filter(e=>e.t>=n-48*HR);

/* ---------- writes ---------- */
async function putEvent(ev){
  events[ev.id]=ev; saveLocal(); render();
  if(!db)return true;
  const ref=db.doc('days/'+dayKey(ev.t));
  try{await ref.update({events:{[ev.id]:ev}});return true}
  catch(e){
    if(e&&e.code==='invalid_argument'){
      try{const snap=await ref.get();
        if(snap.exists)await ref.update({events:{[ev.id]:ev}});
        else await ref.set({date:dayKey(ev.t),events:{[ev.id]:ev}});
        return true;
      }catch(e2){return writeFailed(e2)}
    }
    return writeFailed(e);
  }
}
async function patchEvent(id,patch){
  const cur=events[id]; if(!cur)return;
  events[id]=Object.assign({},cur,patch); saveLocal(); render();
  if(!db)return;
  try{await db.doc('days/'+dayKey(cur.t)).update({events:{[id]:patch}})}catch(e){writeFailed(e)}
}
async function removeEvent(id){
  const cur=events[id]; if(!cur)return;
  delete events[id]; saveLocal(); render();
  if(!db)return;
  try{await db.doc('days/'+dayKey(cur.t)).update({events:{[id]:null}})}catch(e){writeFailed(e)}
}
function writeFailed(e){
  if(e&&e.code==='invalid_argument'){readOnly=true;showToast('You can view this log but not add to it. Ask the owner to share it with you as a Contributor.');}
  else if(e&&e.code==='quota_exceeded')showToast('The log is full. Remove some old entries to keep logging.');
  else showToast('That didn’t save. Check your connection and try again.');
  render(); return false;
}
async function saveProfile(){
  saveLocal(); render();
  if(db){try{await db.doc('baby/profile').set(profile)}catch(e){writeFailed(e)}}
}

/* ---------- sound ---------- */
let actx=null;
function blip(up=true){
  if(!profile.sound)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime;[0,0.09].forEach((d,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=up?(i?880:660):(i?520:700);g.gain.setValueAtTime(0.0001,t+d);g.gain.exponentialRampToValueAtTime(0.12,t+d+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.16);o.connect(g).connect(actx.destination);o.start(t+d);o.stop(t+d+0.2)});
  }catch(_){}
}

let toastTimer=null, undoFn=null;
function showToast(msg,undo){
  $('#toastMsg').textContent=msg; undoFn=undo||null; $('#toastUndo').hidden=!undo; $('#toast').hidden=false;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{$('#toast').hidden=true;undoFn=null},undo?6000:4500);
}
$('#toastUndo').addEventListener('click',()=>{const f=undoFn;$('#toast').hidden=true;undoFn=null;if(f)f()});

const BABBLE={hunger:['Nom nom?','Mmm-ba-ba!','Ba-ba-bot?'],energy:['Hwaaa…','Mm… sleepy','Nuh-nuh…'],hygiene:['Eww-bah!','Pbbbt!','Uh-oh!'],social:['Da! Da!','Up-pee?','Goo-goo!'],happy:['Gah-gah!','Hee hee!','Bwah!','Ahh-boo!']};
let speechT=null;
function babble(){
  const needs=computeNeeds(); if(needs.energy.sleeping){say('Zzz…');return}
  let low=null,lv=101;['hunger','energy','hygiene','social'].forEach(k=>{const v=needs[k].v;if(v!=null&&v<lv){lv=v;low=k}});
  const pool=lv<40?BABBLE[low]:BABBLE.happy; say(pool[Math.floor(Math.random()*pool.length)]); blip(true);

/* ---------- sheets ---------- */
let sheet=null;
function whenChips(){
  const opts=[['now','Now'],['10','10 min ago'],['30','30 min ago'],['60','1 hr ago'],['custom','Pick a time']];

   <div ${sheet.when==='custom'?'':'hidden'} style="margin-top:8px"><input type="datetime-local" id="customTime" value="${esc(sheet.custom||localInput(Date.now()))}"></div>`;
}
function localInput(t){const d=new Date(t-new Date(t).getTimezoneOffset()*MIN);return d.toISOString().slice(0,16)}
function resolveWhen(){
  if(sheet.when==='now')return Date.now();
  if(sheet.when==='custom'){const v=$('#customTime')&&$('#customTime').value;const t=v?new Date(v).getTime():NaN;return isNaN(t)?Date.now():Math.min(t,Date.now())}

}
function openSheet(kind){

     ${sheet.sub==='bottle'?`<span class="lbl">Amount</span><div class="stepper"><button data-amt="-${step}" aria-label="Less">−</button><output id="amtOut">${fmtAmt(sheet.amount)}</output><button data-amt="${step}" aria-label="More">+</button></div>`:''}

  } else if(k==='diaper'){

  } else if(k==='play'){

function logFrom(kind,sub){
  const t=resolveWhen();
  const ev={id:uid(),type:kind,t};
  if(sub)ev.sub=sub;
  if(kind==='feed'&&sub==='bottle'){ev.amount=Math.round(sheet.amount);profile.lastAmount=ev.amount;saveProfile();}
  if(kind==='sleep')ev.end=null;
  const wasSample=usingSample();
  closeSheet(); putEvent(ev); blip(true);
  const lbl=kind==='sleep'?'Nap started':`${sub&&SUBS[kind]?SUBS[kind][sub]:TYPE_LABEL[kind]} logged`;
  showToast(lbl+(t<Date.now()-2*MIN?` for ${clock(t)}`:'')+(wasSample?'. Sample cleared.':''),()=>removeEvent(ev.id));
}
function wakeUp(){
  const s=sleepingNow(); if(!s)return;
  if(usingSample()){showToast('That nap is part of the sample. Start a real nap to try it.');return}
  const end=Date.now(); patchEvent(s.id,{end}); blip(false);
  showToast(`Awake after ${dur(end-s.t)}`,()=>patchEvent(s.id,{end:null}));
}

  return `<h3>Your baby</h3><p class="hint">Changes save for everyone who shares this page.</p>
   <div class="pv" id="pv">${avatarSVG(L,sheet.face||'happy')}</div>
   <div class="chips" style="justify-content:center;margin-bottom:4px">${[['happy','Happy'],['calm','Content'],['fuss','Fussy'],['sleep','Asleep']].map(([f,l])=>`<button class="chip" data-face="${f}" aria-pressed="${(sheet.face||'happy')===f}" style="min-height:36px;padding:5px 10px">${l}</button>`).join('')}</div>
   <span class="lbl">Skin</span><div class="swatches">${sw(SKIN,'skin','Skin tone')}</div>
   <span class="lbl">Hair</span><div class="chips">${Object.entries(HAIRS).map(([v,l])=>`<button class="chip" data-hair="${v}" aria-pressed="${L.hair===v}">${l}</button>`).join('')}</div>
   <span class="lbl">Hair color</span><div class="swatches">${sw(HAIRC,'hairColor','Hair color')}</div>
   <span class="lbl">Eyes</span><div class="swatches">${sw(EYES,'eyes','Eye color')}</div>
   <span class="lbl">Outfit</span><div class="chips">${Object.entries(OUTFITS).map(([v,l])=>`<button class="chip" data-style="${v}" aria-pressed="${L.style===v}">${l}</button>`).join('')}</div>
   <span class="lbl">Outfit color</span><div class="swatches">${sw(OUTFIT,'outfit','Outfit color')}</div>
   <label class="toggle"><input type="checkbox" id="paci" ${L.paci?'checked':''}> Pacifier</label>
   <div class="grid2" style="margin-top:6px">
    <div class="field"><span class="lbl">Name</span><input type="text" id="setName" value="${esc(sheet.draft.name)}" maxlength="24"></div>
    <div class="field"><span class="lbl">Birthday</span><input type="date" id="setBirth" value="${esc(sheet.draft.birth)}"></div>
   </div>
   <span class="lbl">How fast the bars drain (hours until due)</span>
   <div class="grid2">
    <div class="field"><small>Hunger · between feeds</small><input type="number" step="0.25" min="0.5" max="8" id="setFeed" value="${sheet.draft.feedH}"></div>
    <div class="field"><small>Energy · awake window</small><input type="number" step="0.25" min="0.5" max="8" id="setWake" value="${sheet.draft.wakeH}"></div>
    <div class="field"><small>Hygiene · between changes</small><input type="number" step="0.25" min="0.5" max="8" id="setDiaper" value="${sheet.draft.diaperH}"></div>
    <div class="field"><small>Social · awake time between play</small><input type="number" step="0.25" min="0.5" max="8" id="setPlay" value="${sheet.draft.playH}"></div>
   </div>
   ${a?`<button class="chip" id="useAge" style="margin-top:10px">Use typical times for this age (${a.feedH}h feeds, ${a.wakeH}h awake)</button>`:''}
   <span class="lbl">Bottle units</span><div class="chips"><button class="chip" data-unit="ml" aria-pressed="${sheet.draft.unit==='ml'}">ml</button><button class="chip" data-unit="oz" aria-pressed="${sheet.draft.unit==='oz'}">oz</button></div>
   <label class="toggle" style="margin-top:8px"><input type="checkbox" id="setSound" ${sheet.draft.sound?'checked':''}> Play a little chime when you log</label>
   <p class="disclaim">The bars are a friendly guide built from your log. Typical times are rough starting points. Your baby's cues and your pediatrician's advice come first.</p>
   <button class="primary" id="saveSettings">Save</button>`;
}
function ageFromDraft(){const b=sheet&&sheet.draft&&sheet.draft.birth;if(!b)return null;const d=Math.floor((Date.now()-new Date(b+'T00:00:00'))/DAY);return d>=0?d:null}
function readDraftInputs(){
  const d=sheet.draft, g=id=>$('#'+id);
  if(g('setName'))d.name=g('setName').value.trim()||'Baby';
  if(g('setBirth'))d.birth=g('setBirth').value;
  const num=(id,fb)=>{const v=parseFloat(g(id)&&g(id).value);return isNaN(v)?fb:clamp(v,0.5,8)};
  d.feedH=num('setFeed',d.feedH);d.wakeH=num('setWake',d.wakeH);d.diaperH=num('setDiaper',d.diaperH);d.playH=num('setPlay',d.playH);
  if(g('setSound'))d.sound=g('setSound').checked;
  if(g('paci'))d.look.paci=g('paci').checked;
}
function openSettings(){sheet={kind:'settings',draft:clone(profile),face:'happy'};drawSheet();$('#sheetWrap').hidden=false}

/* ---------- events ---------- */
$('#actions').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b)return;
  const k=b.dataset.act;
  if(k==='sleep'&&sleepingNow()){wakeUp();return}
  openSheet(k);
});
$('#settingsBtn').addEventListener('click',openSettings);
$('#historyBtn').addEventListener('click',()=>{sheet={kind:'history'};drawSheet();$('#sheetWrap').hidden=false});
$('#sheetWrap').addEventListener('click',e=>{if(e.target.id==='sheetWrap')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet)closeSheet()});
$('#sheet').addEventListener('change',e=>{
  if(!sheet)return;
  if(sheet.kind==='settings'&&(e.target.id==='setBirth'||e.target.id==='paci')){readDraftInputs();drawSheet()}
  if(e.target.id==='customTime')sheet.custom=e.target.value;
});
$('#sheet').addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t||!sheet)return;
  if(t.id==='closeSheet'){closeSheet();return}
  if(t.dataset.del){
    if(t.classList.contains('arm')){const id=t.dataset.del;const ev=events[id];removeEvent(id);drawSheet();if(ev)showToast('Entry removed',()=>{putEvent(ev)});return}
    t.classList.add('arm');t.textContent='Remove?';setTimeout(()=>{if(t.isConnected){t.classList.remove('arm');t.textContent='Remove'}},3000);return;
  }
  if(t.dataset.when){sheet.when=t.dataset.when;const c=$('#customTime');if(c)sheet.custom=c.value;drawSheet();return}
  if(t.dataset.sub){sheet.sub=t.dataset.sub;drawSheet();return}
  if(t.dataset.amt){const step=parseFloat(t.dataset.amt);sheet.amount=clamp(sheet.amount+step,0,400);$('#amtOut').textContent=fmtAmt(sheet.amount);return}
  if(t.dataset.quick){logFrom(sheet.kind,t.dataset.quick);return}
  if(t.id==='doLog'){logFrom(sheet.kind,sheet.kind==='feed'?sheet.sub:null);return}
  if(sheet.kind==='settings'){
    readDraftInputs();
    if(t.dataset.look){sheet.draft.look[t.dataset.look]=parseInt(t.dataset.val,10);drawSheet();return}
    if(t.dataset.hair){sheet.draft.look.hair=t.dataset.hair;drawSheet();return}
    if(t.dataset.style){sheet.draft.look.style=t.dataset.style;drawSheet();return}
    if(t.dataset.face){sheet.face=t.dataset.face;drawSheet();return}
    if(t.dataset.unit){sheet.draft.unit=t.dataset.unit;drawSheet();return}
    if(t.id==='useAge'){const a=ageDefaults(ageFromDraft());if(a){sheet.draft.feedH=a.feedH;sheet.draft.wakeH=a.wakeH;drawSheet()}return}
    if(t.id==='saveSettings'){profile=mergeProfile(sheet.draft);closeSheet();saveProfile();showToast('Saved');return}
  }
});

/* ---------- boot ---------- */
render();
setInterval(render,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});

if(!(window.claude&&window.claude.use)){loadLocal();render();}
else window.claude.use('db').then(d=>{
  if(!d){loadLocal();render();return}
  db=d;
  db.collection('days').orderBy('date','desc').limit(10).onSnapshot(snap=>{
    const next={};
    snap.docs.forEach(doc=>{const ev=(doc.data()||{}).events||{};for(const id in ev){if(ev[id]&&ev[id].t)next[id]=ev[id]}});
    events=next; render();
  },()=>showToast('Live updates paused. Reload the page to reconnect.'));
  db.doc('baby/profile').onSnapshot(s=>{if(s.exists){profile=mergeProfile(s.data());render()}},()=>{});
  render();
}).catch(()=>{loadLocal();render()});
})();
</script>

</body>
</html>
